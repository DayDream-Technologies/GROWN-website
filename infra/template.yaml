AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stripe Checkout Session + webhook for GROWN website SPA.

Metadata:
  StripeDashboardChecklist:
    CreateProducts: Create Stripe Products and Prices for each SKU in stripe-catalog.json; paste price_ IDs into that file before deploy.
    Webhook: After deploy, copy HttpApi URL from stack Outputs; in Stripe Dashboard add endpoint POST .../webhooks/stripe; subscribe to checkout.session.completed and customer.subscription.* as needed.
    Secrets: Pass StripeSecretKey and StripeWebhookSecret at deploy time (never commit).

Globals:
  Function:
    Timeout: 30
    MemorySize: 256

Parameters:
  AllowedOrigin:
    Type: String
    Description: >-
      Browser origin(s) for CORS — must match the live site(s) exactly (scheme + host, no path).
      Comma-separated for multiple sites, e.g. https://grownhydrofarms.com,https://preview.amplifyapp.com
      (no spaces around commas). Use * only for debugging.
    Default: '*'
  SiteUrl:
    Type: String
    Description: Public site base URL including path prefix if used (no trailing slash). Used for Checkout return_url.
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret API key (sk_live_... or sk_test_...)
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Signing secret from Stripe webhook endpoint (whsec_...)

Resources:
  StripeHttpApi:
    Type: AWS::Serverless::HttpApi

  CheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: checkout-session/
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          SITE_URL: !Ref SiteUrl
          CORS_ORIGIN: !Ref AllowedOrigin
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        CheckoutApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /checkout/session
            Method: POST
        CheckoutApiOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /checkout/session
            Method: OPTIONS
        CatalogOneTimePricesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /catalog/one-time-prices
            Method: GET
        CatalogOneTimePricesApiOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /catalog/one-time-prices
            Method: OPTIONS

  StripeProductsDebugFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: stripe-products-debug/
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          CORS_ORIGIN: !Ref AllowedOrigin
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        StripeProductsDebugApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /debug/stripe-products
            Method: GET
        StripeProductsDebugApiOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /debug/stripe-products
            Method: OPTIONS

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      CodeUri: webhook/
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        StripeWebhookApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref StripeHttpApi
            Path: /webhooks/stripe
            Method: POST

Outputs:
  HttpApiUrl:
    Description: Base URL for API (/checkout/session, GET /catalog/one-time-prices, /webhooks/stripe, /debug/stripe-products)
    Value: !Sub https://${StripeHttpApi}.execute-api.${AWS::Region}.amazonaws.com
