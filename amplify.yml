# AWS Amplify Hosting — build spec (repo overrides console when present).
# SPA deep links: `npm run build` runs `scripts/spa-static-paths.mjs` after Vite.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
