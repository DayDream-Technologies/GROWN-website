# Deploy Stripe Lambda + API Gateway (SAM) — separate from GitHub Pages build.
#
# AWS auth (pick ONE):
#   • Default — IAM user keys: set environment secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (on **production**)
#   • OIDC — set environment variable AWS_USE_OIDC=true and secret AWS_ROLE_TO_ASSUME on **production**.
#     Requires AWS IAM OIDC provider for GitHub + trust policy on the role for this repo.
#
# Also required: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET | Variables: SITE_URL, ALLOWED_ORIGIN
# Optional variable: AWS_REGION (defaults to us-east-1)
#
# Secrets and variables live under GitHub → Settings → Environments → production
# (the deploy job uses environment: production).

name: Deploy Stripe API (SAM)

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/stripe-api.yml"
  workflow_dispatch:

concurrency:
  group: stripe-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for AWS OIDC (no-op for access-key auth)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            infra/checkout-session/package-lock.json
            infra/webhook/package-lock.json

      - name: Install Lambda dependencies
        run: |
          cd infra/checkout-session && npm ci
          cd ../webhook && npm ci

      - uses: aws-actions/setup-sam@v2

      # configure-aws-credentials needs EITHER access keys OR role-to-assume (OIDC).
      # Using only aws-region + audience (OIDC defaults) without a role causes:
      # "Could not load credentials from any providers"

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_USE_OIDC == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: grown-stripe-api-${{ github.run_id }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_USE_OIDC != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Empty secrets produce StripeWebhookSecret= which SAM CLI rejects as invalid --parameter-overrides format.
      - name: Validate SAM parameters (production environment)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$SITE_URL" ] || fail "SITE_URL is empty. Add it under Settings → Environments → production → Variables."
          [ -n "$ALLOWED_ORIGIN" ] || fail "ALLOWED_ORIGIN is empty. Add it under production → Variables."
          [ -n "$STRIPE_SECRET_KEY" ] || fail "STRIPE_SECRET_KEY is empty. Add it under production → Secrets."
          [ -n "$STRIPE_WEBHOOK_SECRET" ] || fail "STRIPE_WEBHOOK_SECRET is empty. Add Stripe webhook signing secret whsec_… under production → Secrets (Dashboard → Webhooks → endpoint → Signing secret)."

      - name: sam build
        working-directory: infra
        run: sam build

      - name: sam deploy
        working-directory: infra
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --stack-name grown-stripe-api \
            --parameter-overrides \
              "SiteUrl=${SITE_URL}" \
              "AllowedOrigin=${ALLOWED_ORIGIN}" \
              "StripeSecretKey=${STRIPE_SECRET_KEY}" \
              "StripeWebhookSecret=${STRIPE_WEBHOOK_SECRET}"
